<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учет записей — Автосервис</title>
  
  <!-- PWA настройки для iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href='data:application/manifest+json,{"name":"Учет записей","short_name":"Записи","start_url":"/ychet.zapisi.avto/","display":"standalone","background_color":"#0b1120","theme_color":"#0b1120"}'>
  
  <!-- Подключение Supabase и Шрифтов -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    /* =========================================
       ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ
       ========================================= */
    :root {
      --bg: #0b1120; 
      --card-bg: rgba(30, 41, 59, 0.85);
      --accent: #6366f1; 
      --accent-glow: rgba(99, 102, 241, 0.4);
      --accent-hover: #4f46e5;
      --ok: #10b981; 
      --ok-bg: rgba(16, 185, 129, 0.1);
      --warn: #f59e0b; 
      --warn-bg: rgba(245, 158, 11, 0.1);
      --err: #ef4444; 
      --err-bg: rgba(239, 68, 68, 0.1);
      --border: rgba(255, 255, 255, 0.1); 
      --text: #f8fafc; 
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 0% 0%, rgba(255, 0, 0, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 100% 0%, rgba(0, 255, 0, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(0, 0, 255, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(255, 0, 255, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text); 
      min-height: 100vh; 
      padding: 24px 20px; 
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent; 
      overflow-x: hidden; 
      position: relative;
    }

    .app { 
      max-width: 1400px; 
      margin: 0 auto; 
      position: relative; 
      z-index: 2; 
    }

    /* =========================================
       ШАПКА
       ========================================= */
    .header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 24px; 
      flex-wrap: wrap; 
      gap: 16px; 
    }

    .header h1 { 
      font-size: 1.8rem; 
      font-weight: 800; 
      letter-spacing: -0.02em; 
      display: flex; 
      align-items: center; 
      gap: 12px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899, #6366f1);
      background-size: 300% 100%; 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent;
      animation: rgbShift 5s linear infinite;
    }

    /* Стили для логотипа в шапке */
    .site-logo {
      height: 45px;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    @keyframes rgbShift { 
      0% { background-position: 0% 50%; } 
      100% { background-position: 100% 50%; } 
    }

    .header-controls { 
      display: flex; 
      align-items: center; 
      gap: 16px; 
      flex-wrap: wrap; 
    }

    .badge-cloud { 
      font-size: 0.8rem; 
      font-weight: 600; 
      background: var(--ok-bg); 
      color: var(--ok); 
      padding: 6px 14px; 
      border-radius: 999px; 
      border: 1px solid var(--ok); 
      box-shadow: 0 0 15px var(--ok-bg); 
    }

    /* =========================================
       ТУМБЛЕРЫ (RGB и Новый год)
       ========================================= */
    .toggle-container { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      font-size: 0.85rem; 
      font-weight: 600; 
      color: var(--text-muted); 
      cursor: pointer; 
      user-select: none; 
    }

    .toggle-switch { 
      position: relative; 
      width: 44px; 
      height: 24px; 
      background: var(--border); 
      border-radius: 12px; 
      transition: 0.3s; 
    }

    .toggle-switch::after { 
      content: ''; 
      position: absolute; 
      top: 2px; 
      left: 2px; 
      width: 20px; 
      height: 20px; 
      background: white; 
      border-radius: 50%; 
      transition: 0.3s; 
    }

    #ny-toggle:checked + .toggle-switch { 
      background: var(--err); 
      box-shadow: 0 0 10px var(--err-bg); 
    }
    #ny-toggle:checked + .toggle-switch::after { 
      transform: translateX(20px); 
    }
    #ny-toggle { display: none; }

    #rgb-toggle:checked + .toggle-switch { 
      background: #a855f7; 
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4); 
    }
    #rgb-toggle:checked + .toggle-switch::after { 
      transform: translateX(20px); 
    }
    #rgb-toggle { display: none; }

    /* =========================================
       СЕТКА
       ========================================= */
    .grid { 
      display: grid; 
      grid-template-columns: 380px 1fr; 
      gap: 24px; 
      align-items: start; 
    }

    @media (max-width: 1024px) { 
      .grid { grid-template-columns: 1fr; } 
      .header h1 { font-size: 1.5rem; } 
      .header-controls { width: 100%; justify-content: space-between; } 
    }

    /* =========================================
       КАРТОЧКИ
       ========================================= */
    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(16px); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 24px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
      position: relative; 
      transition: border-color 0.3s, box-shadow 0.3s; 
    }

    .card h2 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      margin-bottom: 20px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }

    /* =========================================
       ФОРМА
       ========================================= */
    label { 
      display: block; 
      font-size: 0.85rem; 
      font-weight: 500; 
      color: var(--text); 
      margin: 14px 0 6px; 
    }

    input, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      font-size: 16px; 
      font-family: inherit; 
      background: rgba(15, 23, 42, 0.6); 
      color: var(--text); 
      transition: all 0.3s ease; 
    }

    input:focus, textarea:focus { 
      outline: none; 
      border-color: var(--accent); 
      background: rgba(30, 41, 59, 0.9); 
      box-shadow: 0 0 0 3px var(--accent-glow); 
    }

    textarea { 
      resize: vertical; 
      min-height: 60px; 
    }

    .row { 
      display: flex; 
      gap: 12px; 
    }
    .row > div { 
      flex: 1; 
      min-width: 0;
    }

    @media (max-width: 480px) {
      .row { 
        flex-direction: column; 
        gap: 0; 
      }
      .row > div { 
        width: 100%; 
      }
    }

    /* =========================================
       КНОПКИ
       ========================================= */
    button { 
      cursor: pointer; 
      border: none; 
      border-radius: 10px; 
      font-family: inherit; 
      font-weight: 600; 
      transition: all 0.2s; 
    }

    .btn-primary { 
      width: 100%; 
      margin-top: 24px; 
      padding: 14px 20px; 
      background: var(--accent); 
      color: #fff; 
      font-size: 1rem; 
      box-shadow: 0 4px 15px var(--accent-glow); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 8px; 
    }

    .btn-primary:hover { 
      background: var(--accent-hover); 
      transform: translateY(-2px); 
    }

    .btn-primary:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      transform: none; 
      box-shadow: none; 
    }

    .btn-icon { 
      padding: 8px 12px; 
      font-size: 0.8rem; 
      border-radius: 8px; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 6px; 
    }

    .btn-send { 
      background: var(--accent-glow); 
      color: var(--accent); 
      border: 1px solid var(--accent); 
    }

    .btn-send:hover { 
      background: var(--accent); 
      color: #fff; 
    }

    .btn-send:disabled { 
      background: rgba(255,255,255,0.05); 
      border-color: var(--border); 
      color: var(--text-muted); 
      cursor: not-allowed; 
    }

    .btn-delete { 
      background: var(--err-bg); 
      color: var(--err); 
      border: 1px solid var(--err); 
    }

    .btn-delete:hover { 
      background: var(--err); 
      color: #fff; 
    }

    .actions { 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
    }

    /* =========================================
       ТАБЛИЦА
       ========================================= */
    .table-wrapper { 
      overflow-x: auto; 
    }

    table { 
      width: 100%; 
      border-collapse: collapse; 
      font-size: 0.85rem; 
    }

    th, td { 
      text-align: left; 
      padding: 14px 10px; 
      border-bottom: 1px solid var(--border); 
      vertical-align: middle; 
    }

    th { 
      color: var(--text-muted); 
      font-size: 0.75rem; 
      text-transform: uppercase; 
      font-weight: 600; 
      letter-spacing: 0.05em; 
    }

    tr:hover td { 
      background: rgba(255,255,255,0.02); 
    }

    .cell-name { 
      font-weight: 600; 
      margin-bottom: 4px; 
      color: #fff; 
      font-size: 0.95rem; 
    }

    .cell-sub { 
      color: var(--text-muted); 
      font-size: 0.8rem; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      margin-top: 4px; 
    }

    .note-cell { 
      background: var(--warn-bg); 
      border-radius: 6px; 
      padding: 6px 10px; 
      font-size: 0.8rem; 
      color: var(--warn); 
      border-left: 3px solid var(--warn); 
      display: inline-block; 
      max-width: 200px; 
    }

    /* =========================================
       БЕЙДЖИ СТАТУСОВ
       ========================================= */
    .badge { 
      display: inline-flex; 
      align-items: center; 
      padding: 4px 10px; 
      border-radius: 999px; 
      font-size: 0.7rem; 
      font-weight: 600; 
      margin-bottom: 6px; 
    }

    .badge-sent { 
      background: var(--ok-bg); 
      color: var(--ok); 
      border: 1px solid var(--ok); 
    }

    .badge-pending { 
      background: var(--warn-bg); 
      color: var(--warn); 
      border: 1px solid var(--warn); 
    }

    .badge-today { 
      background: var(--accent-glow); 
      color: var(--accent); 
      border: 1px solid var(--accent); 
    }

    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr { display: block; }
      thead tr { position: absolute; top: -9999px; left: -9999px; }
      tr { 
        border: 1px solid var(--border); 
        border-radius: 12px; 
        margin-bottom: 16px; 
        background: rgba(0,0,0,0.2); 
        padding: 12px; 
      }
      td { 
        border: none; 
        position: relative; 
        padding: 8px 0; 
      }
      td::before { 
        content: attr(data-label); 
        display: block; 
        font-size: 0.7rem; 
        color: var(--text-muted); 
        text-transform: uppercase; 
        margin-bottom: 4px; 
      }
      .actions { 
        justify-content: flex-start; 
        margin-top: 8px; 
      }
    }

    /* =========================================
       УВЕДОМЛЕНИЯ (TOASTS)
       ========================================= */
    #toast-container { 
      position: fixed; 
      bottom: 24px; 
      right: 24px; 
      z-index: 10000; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }

    .toast { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px); 
      padding: 14px 20px; 
      border-radius: 10px; 
      border: 1px solid var(--border); 
      font-weight: 500; 
      font-size: 0.9rem; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); 
      animation: slideIn 0.3s ease; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }

    .toast.success { border-left: 4px solid var(--ok); }
    .toast.error { border-left: 4px solid var(--err); }

    @keyframes slideIn { 
      from { transform: translateX(100%); opacity: 0; } 
      to { transform: translateX(0); opacity: 1; } 
    }

    /* =========================================
       СИСТЕМНЫЙ ЛОГ (ТЕРМИНАЛ)
       ========================================= */
    .log-wrapper { 
      margin-bottom: 24px; 
      border-radius: 16px; 
      border: 1px solid var(--border); 
      background: #020617; 
      overflow: hidden; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      transition: border-color 0.3s, box-shadow 0.3s; 
    }

    .log-header { 
      background: #1e293b; 
      padding: 8px 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
    }

    .log-box { 
      font-family: 'JetBrains Mono', monospace; 
      font-size: 0.75rem; 
      color: #e2e8f0; 
      padding: 12px 16px; 
      height: 110px; 
      overflow-y: auto; 
      line-height: 1.6; 
    }

    .log-box .t { color: #64748b; margin-right: 8px; }
    .log-box .ok { color: #4ade80; }
    .log-box .err { color: #f87171; }

    .log-box::-webkit-scrollbar { width: 8px; }
    .log-box::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
    .log-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    .log-box::-webkit-scrollbar-thumb:hover { background: #475569; }

    /* =========================================
       RGB ПОДСВЕТКА КОНТУРОВ
       ========================================= */
    body.rgb-mode .card, 
    body.rgb-mode .log-wrapper { 
      animation: rgbGlow 4s linear infinite; 
    }

    @keyframes rgbGlow {
      0% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5), inset 0 0 10px rgba(255,0,0,0.2); }
      25% { border-color: #00ffd5; box-shadow: 0 0 15px rgba(0,255,213,0.5), inset 0 0 10px rgba(0,255,213,0.2); }
      50% { border-color: #7a00ff; box-shadow: 0 0 15px rgba(122,0,255,0.5), inset 0 0 10px rgba(122,0,255,0.2); }
      75% { border-color: #ff7300; box-shadow: 0 0 15px rgba(255,115,0,0.5), inset 0 0 10px rgba(255,115,0,0.2); }
      100% { border-color: #ff0000; box-shadow: 0 0 15px rgba(255,0,0,0.5), inset 0 0 10px rgba(255,0,0,0.2); }
    }

    /* =========================================
       ЭКРАН ОТМЕНЫ (ДЛЯ КЛИЕНТА)
       ========================================= */
    #cancel-screen { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: var(--bg); 
      z-index: 99999; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      text-align: center; 
    }

    .cancel-content { 
      max-width: 400px; 
      animation: scaleIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    }

    @keyframes scaleIn { 
      from { transform: scale(0.8); opacity: 0; } 
      to { transform: scale(1); opacity: 1; } 
    }

    /* Стили для логотипа на экране отмены */
    .cancel-logo {
      max-width: 140px;
      width: 100%;
      height: auto;
      margin-bottom: 25px;
      border-radius: 12px;
    }

    .cancel-title { font-size: 2rem; font-weight: 700; margin-bottom: 12px; color: var(--err); }
    .cancel-text { font-size: 1.1rem; color: var(--text-muted); }

    /* =========================================
       НОВОГОДНИЕ ЭФФЕКТЫ
       ========================================= */
    #snow-container { 
      position: fixed; 
      inset: 0; 
      pointer-events: none; 
      z-index: 1; 
      display: none; 
    }
    
    body.ny-mode #snow-container { display: block; }

    .snowflake { 
      position: absolute; 
      top: -10px; 
      background: #fff; 
      border-radius: 50%; 
      opacity: 0.8; 
      animation: fall linear infinite; 
    }

    @keyframes fall { 
      to { transform: translateY(100vh); } 
    }

    .garland { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 30px; 
      z-index: 50; 
      display: none; 
      pointer-events: none; 
      justify-content: space-around; 
      padding: 0 10px; 
    }

    body.ny-mode .garland { display: flex; }

    .bulb { 
      width: 12px; 
      height: 18px; 
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; 
      background: red; 
      margin-top: -10px; 
      box-shadow: 0 0 15px red; 
      animation: flash 1.5s infinite alternate; 
    }

    .bulb:nth-child(2n) { animation-delay: 0.5s; background: blue; box-shadow: 0 0 15px blue; }
    .bulb:nth-child(3n) { animation-delay: 1s; background: green; box-shadow: 0 0 15px green; }
    .bulb:nth-child(4n) { animation-delay: 1.5s; background: yellow; box-shadow: 0 0 15px yellow; }

    @keyframes flash { 
      0% { opacity: 0.3; } 
      100% { opacity: 1; } 
    }
  </style>
</head>
<body>

  <!-- Новогодние элементы -->
  <div class="garland" id="garland"></div>
  <div id="snow-container"></div>

  <!-- Экран отмены -->
  <div id="cancel-screen">
    <div class="cancel-content">
      <!-- Добавлен Логотип -->
      <img src="https://martinmefik1.github.io/ychet.zapisi.avto/83B98EE8-954B-4375-ADB7-A0983B869F72.png" alt="Логотип" class="cancel-logo">
      <div class="cancel-title">Запись отменена</div>
      <div class="cancel-text">
        Ваша запись на диагностику успешно отменена.<br>
        Мастер уже получил уведомление.<br><br>
        <span style="font-size: 0.9rem; opacity: 0.7;">Вы можете закрыть эту вкладку.</span>
      </div>
    </div>
  </div>

  <!-- Уведомления -->
  <div id="toast-container"></div>

  <div class="app">
    <div class="header">
      <h1>
        <!-- Добавлен Логотип в шапку -->
        <img src="https://martinmefik1.github.io/ychet.zapisi.avto/83B98EE8-954B-4375-ADB7-A0983B869F72.png" alt="Логотип" class="site-logo">
        Учет записей
      </h1>
      <div class="header-controls">
        <label class="toggle-container">
          <input type="checkbox" id="rgb-toggle" onchange="toggleRGB(this)">
          <span class="toggle-switch"></span> 🌈 RGB
        </label>
        <label class="toggle-container">
          <input type="checkbox" id="ny-toggle" onchange="toggleNewYear(this)">
          <span class="toggle-switch"></span> 🎄 Новый год
        </label>
        <span class="badge-cloud" id="status-badge">🟢 Онлайн</span>
      </div>
    </div>

    <!-- Терминал -->
    <div class="log-wrapper">
      <div class="log-header">
        <div style="font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;">Системный лог</div>
        <button style="background:transparent; color:var(--text-muted); font-size:0.75rem;" onclick="clearLog()">Очистить</button>
      </div>
      <div id="log" class="log-box"></div>
    </div>

    <div class="grid">
      <!-- Форма -->
      <div class="card">
        <h2>➕ Новая запись</h2>
        <form id="form">
          <label for="name">Имя клиента</label>
          <input id="name" required placeholder="Иван Петров">
          
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="client@mail.ru">
          
          <label for="car">Марка и модель авто</label>
          <input id="car" required placeholder="Toyota Camry">
          
          <label for="address">Адрес</label>
          <input id="address" placeholder="ул. Ленина, 10">
          
          <div class="row">
            <div><label for="date">Дата</label><input id="date" type="date" required></div>
            <div><label for="time">Время</label><input id="time" type="time" required></div>
          </div>
          
          <label for="notes">📝 Заметки для мастера (скрыто)</label>
          <textarea id="notes" placeholder="Стук в подвеске..."></textarea>
          
          <button class="btn-primary" type="submit" id="submit-btn">Сохранить и отправить</button>
        </form>
      </div>

      <!-- Таблица записей -->
      <div class="card">
        <h2>📋 Все записи</h2>
        <div id="list" class="table-wrapper">
          <div style="color: var(--text-muted); text-align: center; padding: 20px;">Загрузка...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================
       НАСТРОЙКИ И ПОДКЛЮЧЕНИЕ
       ========================================= */
    const SUPABASE_URL = 'https://zbnsktordbudmuqvmcvs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_46Kt_R95Ri4W3ZJd0JHNwQ_c_es5diR'; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const MASTER_EMAIL = 'vag.feature.avito@gmail.com'; 
    const SITE_URL = 'https://martinmefik1.github.io/ychet.zapisi.avto/';
    // Путь к логотипу для писем
    const LOGO_URL = 'https://martinmefik1.github.io/ychet.zapisi.avto/83B98EE8-954B-4375-ADB7-A0983B869F72.png';

    /* =========================================
       СИСТЕМНЫЙ ЛОГ
       ========================================= */
    let logLines = [];
    function addLog(text, type = '') {
      const time = new Date().toLocaleTimeString('ru-RU');
      logLines.push({ time, text, type });
      if (logLines.length > 50) logLines.shift();
      
      const el = document.getElementById('log');
      el.innerHTML = logLines.map(l => 
        `<div><span class="t">[${l.time}]</span><span class="${l.type}">${escapeHtml(l.text)}</span></div>`
      ).join('');
      el.scrollTop = el.scrollHeight;
    }

    function clearLog() { 
      logLines = []; 
      document.getElementById('log').innerHTML = ''; 
    }

    function escapeHtml(s) { 
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
    }

    function showToast(message, type = 'success') {
      const t = document.createElement('div'); 
      t.className = `toast ${type}`;
      t.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> ${escapeHtml(message)}`;
      document.getElementById('toast-container').appendChild(t);
      setTimeout(() => { 
        t.style.animation = 'slideIn 0.3s ease reverse forwards'; 
        setTimeout(() => t.remove(), 300); 
      }, 3500);
    }

    /* =========================================
       ОТПРАВКА ПИСЕМ
       ========================================= */
    async function sendEmail({ to, subject, body }) {
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Authorization': `Bearer ${SUPABASE_KEY}` 
          },
          body: JSON.stringify({ to, subject, body })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Ошибка сервера');
        
        addLog(`✉️ Письмо отправлено: ${to}`, 'ok');
        return true;
      } catch (err) {
        addLog(`❌ Ошибка отправки: ${err.message}`, 'err');
        return false;
      }
    }

    /* =========================================
       НОВЫЙ ШАБЛОН ПИСЬМА (С ЛОГОТИПОМ)
       ========================================= */
    function getEmailTemplate({ title, color, name, car, date, time, address, isCancelBtn, cancelLink }) {
      return `
      <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; padding: 40px 20px; line-height: 1.6;">
        <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08);">
          
          <!-- Шапка письма с логотипом -->
          <div style="background: #0f172a; padding: 30px; text-align: center; border-bottom: 4px solid ${color};">
            <img src="${LOGO_URL}" alt="Логотип Автосервиса" style="max-width: 120px; height: auto; margin-bottom: 15px; border-radius: 8px; display: inline-block;">
            <h1 style="color: #ffffff; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: 1px;">АВТОСЕРВИС</h1>
            <p style="color: #94a3b8; margin: 8px 0 0 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;">${title}</p>
          </div>
          
          <!-- Тело письма -->
          <div style="padding: 40px 30px; color: #334155;">
            <p style="font-size: 18px; margin-top: 0; font-weight: 600; color: #0f172a;">Здравствуйте, ${name}!</p>
            <p style="font-size: 15px; color: #475569; margin-bottom: 25px;">Благодарим за доверие. Ваша запись успешно подтверждена. Ниже представлена подробная информация о вашем визите:</p>
            
            <!-- Блок с информацией -->
            <div style="background: #f8fafc; border-radius: 12px; padding: 20px 25px; margin: 25px 0; border: 1px solid #e2e8f0;">
              <table style="width: 100%; border-collapse: collapse;">
                ${car ? `
                <tr>
                  <td style="padding: 10px 0; color: #64748b; width: 40px; font-size: 20px; vertical-align: top;">🚘</td>
                  <td style="padding: 10px 0; font-size: 15px; color: #1e293b;"><span style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Автомобиль</span> <b style="font-size: 16px; color: ${color};">${car}</b></td>
                </tr>` : ''}
                <tr>
                  <td style="padding: 10px 0; color: #64748b; width: 40px; font-size: 20px; vertical-align: top;">📅</td>
                  <td style="padding: 10px 0; font-size: 15px; color: #1e293b;"><span style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Дата</span> <b>${date}</b></td>
                </tr>
                <tr>
                  <td style="padding: 10px 0; color: #64748b; width: 40px; font-size: 20px; vertical-align: top;">⏰</td>
                  <td style="padding: 10px 0; font-size: 15px; color: #1e293b;"><span style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Время</span> <b>${time}</b></td>
                </tr>
                ${address ? `
                <tr>
                  <td style="padding: 10px 0; color: #64748b; width: 40px; font-size: 20px; vertical-align: top;">📍</td>
                  <td style="padding: 10px 0; font-size: 15px; color: #1e293b;"><span style="color: #64748b; font-size: 13px; display: block; margin-bottom: 2px;">Адрес</span> <b>${address}</b></td>
                </tr>` : ''}
              </table>
            </div>

            <!-- Блок совета -->
            <div style="background: #fffbeb; border-left: 4px solid #f59e0b; padding: 20px; border-radius: 0 8px 8px 0; margin-bottom: 25px;">
              <p style="margin: 0 0 12px 0; font-size: 15px; color: #92400e; font-weight: 600;">💡 Рекомендация от мастеров</p>
              <p style="margin: 0 0 10px 0; font-size: 14px; color: #78350f;">
                Если у вас <b>выездная диагностика</b>, пожалуйста, прогрейте автомобиль до рабочей температуры.
              </p>
              <p style="margin: 0; font-size: 13px; color: #92400e; font-style: italic;">
                * Исключение: если проблема проявляется только на холодном двигателе, прогрев не требуется.
              </p>
            </div>

            <!-- Блок контактов -->
            <div style="background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px 20px; border-radius: 8px; margin-bottom: 30px; text-align: center;">
              <p style="margin: 0; font-size: 14px; color: #166534;">
                Если ваши планы изменились, пожалуйста, свяжитесь с нами:<br>
                <a href="tel:+79774770587" style="color: #15803d; text-decoration: none; font-weight: bold; font-size: 16px; display: inline-block; margin-top: 5px;">+7 (977) 477-05-87 (Андрей)</a>
              </p>
            </div>

            <!-- Блок отмены -->
            ${isCancelBtn ? `
              <div style="text-align: center; margin-top: 30px; padding-top: 25px; border-top: 1px solid #e2e8f0;">
                <p style="font-size: 13px; color: #64748b; margin-bottom: 15px;">Вы также можете отменить запись онлайн:</p>
                <a href="${cancelLink}" style="background: #ef4444; color: #ffffff; text-decoration: none; padding: 14px 30px; border-radius: 8px; font-weight: bold; font-size: 15px; display: inline-block; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);">Отменить запись</a>
              </div>
            ` : ''}
          </div>

          <!-- Подвал -->
          <div style="background: #f1f5f9; padding: 20px; text-align: center; font-size: 12px; color: #94a3b8;">
            Это письмо сгенерировано автоматически. Пожалуйста, не отвечайте на него.<br>
            © ${new Date().getFullYear()} Автосервис
          </div>
        </div>
      </div>`;
    }

    /* =========================================
       РАБОТА С БАЗОЙ ДАННЫХ
       ========================================= */
    async function loadAll() {
      const { data, error } = await db.from('appointments').select('*').order('date').order('time');
      if (error) { 
        addLog(`❌ Ошибка БД: ${error.message}`, 'err'); 
        return []; 
      }
      return data.map(row => ({ ...row, time: row.time.slice(0, 5) }));
    }

    function formatDateRu(iso) { 
      if(!iso) return ''; 
      const [y, m, d] = iso.split('-'); 
      return `${d}.${m}.${y}`; 
    }

    /* =========================================
       ОТРИСОВКА ТАБЛИЦЫ
       ========================================= */
    async function renderList() {
      const items = await loadAll();
      const el = document.getElementById('list');
      
      if (!items.length) { 
        el.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted)">Нет записей</div>'; 
        return; 
      }

      const now = new Date();
      const todayStr = now.toISOString().slice(0, 10);

      el.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Клиент</th>
              <th>Время</th>
              <th>Заметки</th>
              <th>Статус</th>
              <th>Действия</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(it => {
              let b12 = it.date === todayStr 
                ? '<span class="badge badge-today">12ч: сегодня</span>' 
                : it.reminder_12h_sent 
                  ? '<span class="badge badge-sent">12ч: отправлено</span>' 
                  : `<span class="badge badge-pending">12ч: ${new Date(it.date+'T'+it.time) - 43200000 <= now ? 'готово' : 'ожидание'}</span>`;
                  
              let b3 = it.reminder_3h_sent 
                ? '<span class="badge badge-sent">3ч: отправлено</span>' 
                : `<span class="badge badge-pending">3ч: ${new Date(it.date+'T'+it.time) - 10800000 <= now ? 'готово' : 'ожидание'}</span>`;

              const lockUntil = localStorage.getItem('reminder_lock_' + it.id);
              const isLocked = lockUntil && Date.now() < parseInt(lockUntil);

              return `
                <tr>
                  <td data-label="Клиент / Авто">
                    <div class="cell-name">${escapeHtml(it.name)}</div>
                    <div class="cell-sub" style="color:var(--accent);">🚗 ${escapeHtml(it.car)}</div>
                    <div class="cell-sub">✉️ ${escapeHtml(it.email)}</div>
                  </td>
                  <td data-label="Время">
                    <b>${formatDateRu(it.date)}</b><br>
                    <span style="color:var(--text-muted)">${it.time}</span>
                  </td>
                  <td data-label="Заметки">
                    ${it.notes ? `<div class="note-cell">${escapeHtml(it.notes)}</div>` : '—'}
                  </td>
                  <td data-label="Статус">
                    <div>${b12}</div>
                    <div>${b3}</div>
                  </td>
                  <td data-label="Действия">
                    <div class="actions">
                      <button class="btn-icon btn-send" id="btn-remind-${it.id}" onclick="sendManualReminder('${it.id}', this)" ${isLocked ? 'disabled' : ''}>
                        ${isLocked ? '⏳ Ждите...' : '✉️ Напомнить'}
                      </button>
                      <button class="btn-icon btn-delete" onclick="removeItem('${it.id}')">🗑️</button>
                    </div>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>`;
        
      startButtonTimers();
    }

    /* =========================================
       РУЧНОЕ НАПОМИНАНИЕ
       ========================================= */
    async function sendManualReminder(id, btn) {
      btn.disabled = true;
      btn.innerHTML = '⏳ Отправка...';

      const { data: it, error } = await db.from('appointments').select('*').eq('id', id).single();
      if (error || !it) { 
        showToast('Ошибка: запись не найдена', 'error'); 
        btn.disabled = false; 
        btn.innerHTML = '✉️ Напомнить'; 
        return; 
      }

      const html = getEmailTemplate({
        title: 'Напоминание о визите', 
        color: '#6366f1', 
        name: it.name,
        car: it.car, 
        date: formatDateRu(it.date), 
        time: it.time.slice(0,5), 
        address: it.address,
        isCancelBtn: true, 
        cancelLink: `${SITE_URL}?cancel=${it.id}`
      });

      const ok = await sendEmail({ to: it.email, subject: 'Напоминание: вы записаны на диагностику', body: html });
      
      if (ok) {
        showToast(`Письмо отправлено: ${it.name}`);
        localStorage.setItem('reminder_lock_' + id, Date.now() + 300000); // Блокировка на 5 минут
        startButtonTimers(); 
      } else {
        showToast('Ошибка отправки (Проверьте пароль в Supabase)', 'error');
        btn.disabled = false; 
        btn.innerHTML = '✉️ Напомнить';
      }
    }

    function startButtonTimers() {
      if (window.btnTimer) clearInterval(window.btnTimer);
      
      window.btnTimer = setInterval(() => {
        document.querySelectorAll('.btn-send').forEach(btn => {
          const id = btn.id.replace('btn-remind-', '');
          if (!id) return;
          
          const lockUntil = localStorage.getItem('reminder_lock_' + id);
          
          if (lockUntil && Date.now() < parseInt(lockUntil)) {
            const ms = parseInt(lockUntil) - Date.now();
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            btn.innerHTML = `⏳ ${m}:${s.toString().padStart(2, '0')}`;
            btn.disabled = true;
          } else if (btn.disabled && btn.innerHTML.includes('⏳')) {
            btn.innerHTML = '✉️ Напомнить';
            btn.disabled = false;
          }
        });
      }, 1000);
    }

    async function removeItem(id) { 
      if (confirm('Удалить эту запись?')) {
        await db.from('appointments').delete().eq('id', id);
        localStorage.removeItem('reminder_lock_' + id);
        showToast('Запись удалена', 'success');
      }
    }

    /* =========================================
       АВТО-НАПОМИНАНИЯ (12Ч И 3Ч)
       ========================================= */
    async function checkReminders() {
      const items = await loadAll();
      const now = new Date();
      let sentCount = 0;

      for (const it of items) {
        const apptTime = new Date(it.date+'T'+it.time).getTime();
        const timeUntil = apptTime - now.getTime();
        
        if (timeUntil < 0) continue; 
        
        const cancelLink = `${SITE_URL}?cancel=${it.id}`;

        // ЛОГИКА 12 ЧАСОВ
        if (!it.reminder_12h_sent && it.date !== now.toISOString().slice(0,10)) {
          if (timeUntil <= 12 * 60 * 60 * 1000) {
            if (timeUntil > 11 * 60 * 60 * 1000) {
              const html = getEmailTemplate({ 
                title: 'Напоминание: завтра диагностика', 
                color: '#6366f1', 
                name: it.name, 
                car: it.car, 
                date: formatDateRu(it.date), 
                time: it.time, 
                address: it.address, 
                isCancelBtn: true, 
                cancelLink 
              });
              if (await sendEmail({ to: it.email, subject: 'Напоминание: диагностика завтра', body: html })) {
                await db.from('appointments').update({ reminder_12h_sent: true }).eq('id', it.id); 
                sentCount++;
              }
            } else {
              await db.from('appointments').update({ reminder_12h_sent: true }).eq('id', it.id);
            }
          }
        }

        // ЛОГИКА 3 ЧАСА
        if (!it.reminder_3h_sent) {
          if (timeUntil <= 3 * 60 * 60 * 1000) {
            const html = getEmailTemplate({ 
              title: 'Напоминание: диагностика через 3 часа', 
              color: '#f59e0b', 
              name: it.name, 
              car: it.car, 
              date: formatDateRu(it.date), 
              time: it.time, 
              address: it.address, 
              isCancelBtn: true, 
              cancelLink 
            });
            if (await sendEmail({ to: it.email, subject: 'Напоминание: диагностика через 3 часа', body: html })) {
              await db.from('appointments').update({ reminder_3h_sent: true }).eq('id', it.id); 
              sentCount++;
            }
          }
        }
      }
      
      if (sentCount > 0) addLog(`✅ Авто-напоминаний отправлено: ${sentCount}`, 'ok');
      renderList();
    }

    /* =========================================
       ОТМЕНА ЗАПИСИ КЛИЕНТОМ
       ========================================= */
    async function handleCancellation(cancelId) {
      document.querySelector('.app').style.display = 'none';
      document.querySelector('.garland').style.display = 'none';
      document.getElementById('cancel-screen').style.display = 'flex';

      const { data: rows } = await db.from('appointments').select('*').eq('id', cancelId);
      
      if (rows && rows.length > 0) {
        const appt = rows[0];
        if (await db.from('appointments').delete().eq('id', cancelId).then(()=>true)) {
          if ("Notification" in window && Notification.permission === "granted") {
            new Notification("❌ Запись отменена", { body: `${appt.name} отменил запись` });
          }
          const masterHtml = getEmailTemplate({ 
            title: 'Запись отменена клиентом', 
            color: '#ef4444', 
            name: 'Мастер', 
            car: appt.car, 
            date: formatDateRu(appt.date), 
            time: appt.time.slice(0,5), 
            address: appt.address, 
            introText: `Клиент <b>${escapeHtml(appt.name)}</b> отменил запись.` 
          });
          await sendEmail({ to: MASTER_EMAIL, subject: `❌ Отмена: ${appt.name}`, body: masterHtml });
        }
      }
    }

    /* =========================================
       ДОБАВЛЕНИЕ ЗАПИСИ
       ========================================= */
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.textContent = 'Сохранение...'; 
      btn.disabled = true;

      const item = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        car: document.getElementById('car').value.trim(),
        address: document.getElementById('address').value.trim(),
        notes: document.getElementById('notes').value.trim(),
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        reminder_12h_sent: false, 
        reminder_3h_sent: false
      };

      try {
        const { data, error } = await db.from('appointments').insert([item]).select();
        if (error) throw error;
        
        addLog(`✅ Запись создана: ${item.name}`, 'ok');
        btn.textContent = 'Отправка письма...';

        const html = getEmailTemplate({ 
          title: 'Вы записаны на диагностику', 
          color: '#10b981', 
          name: item.name, 
          car: item.car, 
          date: formatDateRu(item.date), 
          time: item.time, 
          address: item.address, 
          isCancelBtn: true, 
          cancelLink: `${SITE_URL}?cancel=${data[0].id}` 
        });
        
        await sendEmail({ to: item.email, subject: 'Запись на диагностику создана', body: html });

        showToast('Запись создана!');
        e.target.reset();
        document.getElementById('date').value = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
        document.getElementById('time').value = '10:00';
        
        renderList();
        checkReminders();
      } catch (err) {
        addLog(`❌ Ошибка: ${err.message}`, 'err');
        showToast('Ошибка базы данных', 'error');
      } finally {
        btn.textContent = 'Сохранить и отправить'; 
        btn.disabled = false;
      }
    });

    /* =========================================
       ЭФФЕКТЫ (RGB И НОВЫЙ ГОД)
       ========================================= */
    function toggleRGB(checkbox) {
      if (checkbox.checked) { 
        document.body.classList.add('rgb-mode'); 
        localStorage.setItem('rgb_mode', 'true'); 
      } else { 
        document.body.classList.remove('rgb-mode'); 
        localStorage.setItem('rgb_mode', 'false'); 
      }
    }

    function toggleNewYear(checkbox) {
      if (checkbox.checked) {
        document.body.classList.add('ny-mode'); 
        localStorage.setItem('ny_mode', 'true');
        
        const garland = document.getElementById('garland'); 
        garland.innerHTML = '';
        for(let i=0; i<30; i++) { 
          const b = document.createElement('div'); 
          b.className = 'bulb'; 
          garland.appendChild(b); 
        }
        
        const snowContainer = document.getElementById('snow-container'); 
        snowContainer.innerHTML = '';
        for (let i = 0; i < 50; i++) {
          const s = document.createElement('div'); 
          s.className = 'snowflake';
          s.style.left = Math.random() * 100 + 'vw';
          s.style.width = s.style.height = (Math.random() * 4 + 2) + 'px';
          s.style.animationDuration = (Math.random() * 3 + 2) + 's';
          s.style.animationDelay = Math.random() * 5 + 's';
          snowContainer.appendChild(s);
        }
      } else {
        document.body.classList.remove('ny-mode'); 
        localStorage.setItem('ny_mode', 'false');
        document.getElementById('garland').innerHTML = ''; 
        document.getElementById('snow-container').innerHTML = '';
      }
    }

    /* =========================================
       ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
       ========================================= */
    (async () => {
      if (localStorage.getItem('rgb_mode') === 'true') { 
        document.getElementById('rgb-toggle').checked = true; 
        toggleRGB(document.getElementById('rgb-toggle')); 
      }
      
      if (localStorage.getItem('ny_mode') === 'true') { 
        document.getElementById('ny-toggle').checked = true; 
        toggleNewYear(document.getElementById('ny-toggle')); 
      }
      
      if ("Notification" in window && Notification.permission === "default") { 
        try { await Notification.requestPermission(); } catch(e) {} 
      }

      document.getElementById('date').value = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
      document.getElementById('time').value = '10:00';

      const urlParams = new URLSearchParams(window.location.search);
      
      if (urlParams.get('cancel')) {
        await handleCancellation(urlParams.get('cancel'));
      } else {
        addLog('🚀 Система запущена', 'ok');
        await renderList();
        
        db.channel('realtime-appointments')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'appointments' }, () => { 
            addLog('🔄 Синхронизация', 'ok'); 
            renderList(); 
          })
          .subscribe();
          
        checkReminders();
        setInterval(() => checkReminders(), 60000);
      }
    })();
  </script>
</body>
</html>
