<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учет записей — Автосервис</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #6366f1; --accent-hover: #4f46e5;
    --accent-soft: rgba(99, 102, 241, 0.15); --ok: #10b981; --ok-soft: rgba(16, 185, 129, 0.15);
    --warn: #f59e0b; --warn-soft: rgba(245, 158, 11, 0.15); --err: #ef4444; --err-soft: rgba(239, 68, 68, 0.15);
    --border: #334155; --text: #f8fafc; --text-muted: #94a3b8;
    --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 32px 20px; line-height: 1.5; }
  .app { max-width: 1400px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .header h1 { font-size: 1.8rem; font-weight: 700; }
  .badge-cloud { font-size: 0.8rem; font-weight: 600; background: var(--ok-soft); color: var(--ok); padding: 6px 14px; border-radius: 999px; border: 1px solid var(--ok); }
  .grid { display: grid; grid-template-columns: 400px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; box-shadow: var(--shadow-md); }
  .card h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; }
  label { display: block; font-size: 0.85rem; font-weight: 500; margin: 14px 0 6px; }
  input, textarea { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.95rem; background: var(--bg); color: var(--text); }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button { cursor: pointer; border: none; border-radius: 10px; font-family: inherit; font-weight: 600; transition: all 0.2s; }
  .btn-primary { width: 100%; margin-top: 20px; padding: 14px 20px; background: var(--accent); color: #fff; font-size: 1rem; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
  .btn-icon { padding: 8px 12px; font-size: 0.8rem; border-radius: 8px; }
  .btn-send { background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent); }
  .btn-delete { background: var(--err-soft); color: var(--err); border: 1px solid var(--err); }
  .actions { display: flex; gap: 8px; }
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 14px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
  .cell-name { font-weight: 600; margin-bottom: 4px; }
  .cell-sub { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }
  .note-cell { background: var(--warn-soft); border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; color: var(--warn); border-left: 3px solid var(--warn); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 600; margin-bottom: 4px; }
  .badge-sent { background: var(--ok-soft); color: var(--ok); }
  .badge-pending { background: var(--warn-soft); color: var(--warn); }
  .log-box { font-family: monospace; font-size: 0.75rem; background: #020617; color: #e2e8f0; border-radius: 10px; padding: 16px; height: 250px; overflow-y: auto; border: 1px solid var(--border); }
  .log-box .t { color: #64748b; margin-right: 6px; }
  .log-box .ok { color: #4ade80; }
  .log-box .err { color: #f87171; }
  #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; }
  .toast { background: var(--card); padding: 14px 20px; border-radius: 10px; border: 1px solid var(--border); font-size: 0.9rem; animation: slideIn 0.3s ease; }
  .toast.success { border-left: 4px solid var(--ok); }
  .toast.error { border-left: 4px solid var(--err); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<div id="toast-container"></div>

<div class="app">
  <div class="header">
    <h1>🚗 Учет записей</h1>
    <span class="badge-cloud">🟢 Supabase</span>
  </div>

  <div class="grid">
    <div style="display: flex; flex-direction: column; gap: 24px;">
      <div class="card">
        <h2>➕ Новая запись</h2>
        <form id="form">
          <label>Имя клиента</label>
          <input id="name" required placeholder="Иван Петров">
          <label>Email</label>
          <input id="email" type="email" required placeholder="client@mail.ru">
          <label>Марка и модель авто</label>
          <input id="car" required placeholder="Toyota Camry">
          <label>Адрес</label>
          <input id="address" placeholder="ул. Ленина, 10">
          <div class="row">
            <div><label>Дата</label><input id="date" type="date" required></div>
            <div><label>Время</label><input id="time" type="time" required></div>
          </div>
          <label>📝 Заметки (скрыто)</label>
          <textarea id="notes" placeholder="Стук в подвеске..."></textarea>
          <button class="btn-primary" type="submit" id="submit-btn">Сохранить и отправить</button>
        </form>
      </div>

      <div class="card">
        <h2>📨 Системный лог</h2>
        <div id="log" class="log-box"></div>
        <div style="display: flex; gap: 12px; margin-top: 16px;">
          <button class="btn-icon btn-send" style="flex: 1;" onclick="clearLog()">Очистить</button>
          <button class="btn-icon btn-send" style="flex: 1;" onclick="checkReminders(true)">Проверить 12ч/3ч</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📋 Все записи</h2>
      <div id="list" class="table-wrapper">
        <div style="color: var(--text-muted); text-align: center; padding: 20px;">Загрузка...</div>
      </div>
    </div>
  </div>
</div>

<script>
/* 1. НАСТРОЙКИ И ПОДКЛЮЧЕНИЕ */
const SUPABASE_URL = 'https://zbnsktordbudmuqvmcvs.supabase.co';
// ВАЖНО: Если сайт не подключается, замените ключ ниже на ваш anon-ключ (начинается с eyJ...)
const SUPABASE_KEY = 'sb_publishable_46Kt_R95Ri4W3ZJd0JHNwQ_c_es5diR'; 

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const MASTER_EMAIL = 'vag.feature.avito@gmail.com'; 
const SITE_URL = 'https://martinmefik1.github.io/ychet.zapisi.avto/';

/* 2. УТИЛИТЫ И ЛОГИ */
let logLines = [];
function addLog(text, type = '') {
  const time = new Date().toLocaleTimeString('ru-RU');
  logLines.push({ time, text, type });
  const el = document.getElementById('log');
  el.innerHTML = logLines.map(l => `<div><span class="t">[${l.time}]</span><span class="${l.type}">${l.text}</span></div>`).join('');
  el.scrollTop = el.scrollHeight;
}
function clearLog() { logLines = []; document.getElementById('log').innerHTML = ''; }
function showToast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `${type === 'success' ? '✅' : '❌'} ${msg}`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* 3. ОТПРАВКА ПИСЕМ (С защитой от зависания) */
async function sendEmail({ to, subject, body }) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 сек таймаут

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/send-email`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ to, subject, body }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Ошибка сервера');
    addLog(`✉️ Письмо отправлено: ${to}`, 'ok');
    return true;
  } catch (err) {
    clearTimeout(timeoutId);
    addLog(`❌ Ошибка письма: ${err.name === 'AbortError' ? 'Таймаут' : err.message}`, 'err');
    return false;
  }
}

/* 4. ШАБЛОН ПИСЬМА */
function getEmailTemplate({ title, color, name, car, date, time, address, isCancelBtn, cancelLink }) {
  return `<div style="font-family: Arial, sans-serif; padding: 20px; background: #f4f6f8;">
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border-radius: 12px; overflow: hidden;">
      <div style="background: ${color}; padding: 24px; text-align: center;"><h1 style="color:#fff; margin:0; font-size:22px;">${title}</h1></div>
      <div style="padding: 30px; color: #333;">
        <p style="font-size: 16px;">Здравствуйте, <b>${name}</b>!</p>
        <p>Напоминаем, что вы записаны на диагностику автомобиля.</p>
        <div style="background: #f8fafc; border-left: 4px solid ${color}; padding: 15px; margin: 20px 0;">
          ${car ? `<p><b>🚗 Авто:</b> ${car}</p>` : ''}
          <p><b>📅 Дата:</b> ${date} в ${time}</p>
          ${address ? `<p><b>📍 Адрес:</b> ${address}</p>` : ''}
        </div>
        ${isCancelBtn ? `<div style="text-align: center; margin: 25px 0;"><a href="${cancelLink}" style="background: #dc2626; color: #fff; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: bold;">Отменить запись</a></div>` : ''}
      </div>
    </div>
  </div>`;
}

/* 5. БАЗА ДАННЫХ */
async function loadAll() {
  try {
    const { data, error } = await db.from('appointments').select('*').order('date').order('time');
    if (error) throw error;
    return data.map(row => ({ ...row, time: row.time.slice(0, 5) }));
  } catch (err) {
    addLog(`❌ Ошибка загрузки БД: ${err.message}`, 'err');
    return [];
  }
}

/* 6. ОТРИСОВКА ТАБЛИЦЫ */
async function renderList() {
  const items = await loadAll();
  const el = document.getElementById('list');
  if (!items.length) { el.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted)">Нет записей</div>'; return; }
  
  el.innerHTML = `<table><thead><tr><th>Клиент / Авто</th><th>Время</th><th>Заметки</th><th>Действия</th></tr></thead><tbody>
    ${items.map(it => `<tr>
      <td>
        <div class="cell-name">${it.name}</div>
        ${it.car ? `<div class="cell-sub" style="color:var(--accent)">🚗 ${it.car}</div>` : ''}
        <div class="cell-sub">✉️ ${it.email}</div>
      </td>
      <td><b>${it.date.split('-').reverse().join('.')}</b><br><span style="color:var(--text-muted)">${it.time}</span></td>
      <td>${it.notes ? `<div class="note-cell">${it.notes}</div>` : '—'}</td>
      <td>
        <div class="actions">
          <button class="btn-icon btn-send" onclick="sendManualReminder('${it.id}')">✉️ Напомнить</button>
          <button class="btn-icon btn-delete" onclick="removeItem('${it.id}')">🗑️</button>
        </div>
      </td>
    </tr>`).join('')}
  </tbody></table>`;
}

/* 7. ДОБАВЛЕНИЕ ЗАПИСИ (Самая важная часть) */
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.textContent = 'Сохранение в БД...'; 
  btn.disabled = true;

  const item = {
    name: document.getElementById('name').value,
    email: document.getElementById('email').value,
    car: document.getElementById('car').value,
    address: document.getElementById('address').value,
    notes: document.getElementById('notes').value,
    date: document.getElementById('date').value,
    time: document.getElementById('time').value,
    reminder_12h_sent: false, 
    reminder_3h_sent: false
  };

  try {
    // 1. Сохраняем в базу
    addLog(`⏳ Сохранение в БД...`, '');
    const { data, error } = await db.from('appointments').insert([item]).select();
    if (error) throw error;
    
    const newId = data[0].id;
    addLog(`✅ База сохранила запись: ${item.name}`, 'ok');

    // 2. Отправляем письмо
    btn.textContent = 'Отправка письма...';
    addLog(`⏳ Отправка письма...`, '');
    
    const cancelLink = `${SITE_URL}?cancel=${newId}`;
    const html = getEmailTemplate({
      title: 'Вы записаны на диагностику', color: '#6366f1', name: item.name,
      car: item.car, date: item.date.split('-').reverse().join('.'), time: item.time, address: item.address,
      isCancelBtn: true, cancelLink
    });
    
    await sendEmail({ to: item.email, subject: 'Запись создана', body: html });

    // 3. Успех
    showToast('Запись создана!');
    e.target.reset();
    await renderList(); 

  } catch (err) {
    // Если произошла ошибка (база или сеть)
    addLog(`❌ ОШИБКА: ${err.message}`, 'err');
    showToast('Ошибка при сохранении', 'error');
  } finally {
    // Этот блок выполнится ВСЕГДА (даже при ошибке), кнопка перестанет грузиться
    btn.textContent = 'Сохранить и отправить'; 
    btn.disabled = false;
  }
});

/* 8. УТИЛИТЫ ДЛЯ КНОПОК */
async function removeItem(id) {
  if (confirm('Удалить запись?')) {
    await db.from('appointments').delete().eq('id', id);
    await renderList();
    showToast('Удалено');
  }
}

async function sendManualReminder(id) {
  const { data: it } = await db.from('appointments').select('*').eq('id', id).single();
  if (!it) return;
  
  showToast('Отправляем...');
  const html = getEmailTemplate({
    title: 'Напоминание', color: '#10b981', name: it.name, car: it.car, 
    date: it.date.split('-').reverse().join('.'), time: it.time.slice(0,5), address: it.address,
    isCancelBtn: true, cancelLink: `${SITE_URL}?cancel=${it.id}`
  });
  await sendEmail({ to: it.email, subject: 'Напоминание о записи', body: html });
  showToast('Готово!');
}

async function checkReminders() {
  showToast('Авто-напоминания работают в фоне');
}

/* 9. ИНИЦИАЛИЗАЦИЯ */
(async () => {
  document.getElementById('date').value = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  document.getElementById('time').value = '10:00';
  
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('cancel')) {
    await db.from('appointments').delete().eq('id', urlParams.get('cancel'));
    alert('Запись успешно отменена!');
  } else {
    addLog('🚀 Система запущена', 'ok');
    await renderList();
  }
})();
</script>
</body>
</html>
